<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modbus TCP Simulator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6f8; }
    .device-list .list-group-item { cursor: pointer; }
    .device-list .list-group-item.active .text-muted { color: #d7e3ff !important; }
    .status-dot { height: .6rem; width: .6rem; border-radius: 50%; display: inline-block; background: #2ecc71; }
    .section-header { background: #eef1f6; font-weight: 600; }
    .signal-table input.raw { max-width: 9rem; }
    .signal-table td { vertical-align: middle; }
    .wizard-steps .step { opacity: .45; font-weight: 600; }
    .wizard-steps .step.active { opacity: 1; }
    .wizard-steps .step.done { opacity: 1; color: #2ecc71; }
    #conn-banner { display: none; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; }
    .scaled { color: #6c757d; min-width: 6rem; display: inline-block; }
  </style>
</head>
<body>
  <div id="conn-banner" class="alert alert-warning rounded-0 mb-0 py-1 text-center small">
    &#9888; Connection to the engine lost &mdash; retrying&hellip;
  </div>

  <!-- ====================== SETUP WIZARD VIEW ====================== -->
  <div id="setup-view" style="display:none;">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container"><span class="navbar-brand">Modbus Simulator &mdash; Setup</span></div>
    </nav>
    <div class="container py-4" style="max-width: 820px;">
      <div class="wizard-steps d-flex justify-content-center gap-4 mb-4">
        <span class="step" data-step="1">1 &middot; Config</span>
        <span class="step" data-step="2">2 &middot; Signals</span>
        <span class="step" data-step="3">3 &middot; Start</span>
      </div>
      <div class="card shadow-sm"><div class="card-body" id="setup-body"></div></div>
    </div>
  </div>

  <!-- ====================== RUNTIME VIEW ====================== -->
  <div id="runtime-view" style="display:none;">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container-fluid">
        <span class="navbar-brand" id="rt-project">Modbus Simulator</span>
        <span id="rt-vlan" class="badge text-bg-secondary me-auto"></span>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-success" id="rt-simulate-all">&#9654; Simulate All</button>
          <button class="btn btn-sm btn-outline-light" id="rt-clear-all">&#10005; Clear All</button>
          <button class="btn btn-sm btn-outline-danger" id="rt-stop">Stop</button>
        </div>
      </div>
    </nav>
    <div class="container-fluid py-3">
      <div class="row g-3">
        <div class="col-md-3">
          <div class="list-group device-list shadow-sm" id="rt-devices"></div>
        </div>
        <div class="col-md-9">
          <div class="card shadow-sm">
            <div class="card-body">
              <div id="rt-device-header" class="d-flex justify-content-between align-items-start flex-wrap gap-2"></div>
              <div class="d-flex gap-2 my-3 flex-wrap">
                <button class="btn btn-sm btn-success" id="rt-dev-simulate">&#9654; Simulate</button>
                <button class="btn btn-sm btn-outline-secondary" id="rt-dev-clear">&#10005; Clear</button>
                <button class="btn btn-sm btn-outline-primary" id="rt-dev-edit">&#9998; Edit Signals</button>
                <input class="form-control form-control-sm ms-auto" id="rt-filter" placeholder="Filter signals&hellip;" style="max-width: 16rem;">
              </div>
              <div id="rt-signals"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ====================== EDITOR MODAL ====================== -->
  <div class="modal fade" id="editor-modal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Signals &mdash; <span id="ed-device"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex gap-2 mb-2">
            <button class="btn btn-sm btn-outline-primary" id="ed-add">+ Add Row</button>
            <button class="btn btn-sm btn-outline-secondary" id="ed-download">&#8595; Download CSV</button>
            <label class="btn btn-sm btn-outline-secondary mb-0">&#8593; Upload CSV
              <input type="file" id="ed-upload" accept=".csv" hidden>
            </label>
          </div>
          <div class="table-responsive" style="max-height: 55vh;">
            <table class="table table-sm table-bordered align-middle" id="ed-table">
              <thead class="table-light"><tr>
                <th>name</th><th>register_type</th><th>address</th><th>data_type</th>
                <th>bit</th><th>word_order</th><th>scale</th><th>unit</th><th>section</th>
                <th>default</th><th>writable</th><th></th>
              </tr></thead>
              <tbody id="ed-rows"></tbody>
            </table>
          </div>
          <div id="ed-validation" class="small"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" id="ed-save">Save &amp; Hot Reload</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/webui/app.js"></script>
  <script src="/webui/setup.js"></script>
  <script src="/webui/runtime.js"></script>
  <script src="/webui/editor.js"></script>
</body>
</html>
